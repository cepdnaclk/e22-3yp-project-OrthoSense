services:
  db:
    image: postgres:16-alpine
    container_name: orthosense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orthosense_db
      POSTGRES_USER: orthosense_user
      POSTGRES_PASSWORD: orthosense_password_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthosense_user -d orthosense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orthosense_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: orthosense_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_clinical_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-deploy-orthosense-secure-secret-key-2026"
      DATABASE_URL: "postgres://orthosense_user:orthosense_password_dev@db:5432/orthosense_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      REDIS_URL: "redis://redis:6379/1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

